{% extends "base.html" %}
{% block content %}
<section class="container py-5" dir="rtl">
  <div class="card mx-auto shadow-sm" style="max-width: 34rem;">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">تغییر گذرواژه</h1>
      <p class="text-muted">برای ادامه، یک گذرواژه جدید با حداقل ۱۲ نویسه تعیین کنید.</p>
      <form method="post" autocomplete="off">
        <label class="form-label" for="password">گذرواژه جدید</label>
        <input class="form-control mb-3" id="password" name="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password">
        <label class="form-label" for="password_confirmation">تکرار گذرواژه جدید</label>
        <input class="form-control mb-4" id="password_confirmation" name="password_confirmation" type="password" minlength="12" maxlength="256" required autocomplete="new-password">
        <button class="btn btn-primary" type="submit">ذخیره گذرواژه و ادامه</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('auth.logout') }}">خروج</a>
      </form>
    </div>
  </div>
</section>
{% endblock %}
