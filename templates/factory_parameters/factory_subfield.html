{% extends "base.html" %}{% block content %}
<div class="page-container" dir="rtl">
<nav><a href="{{ url_for('factory_parameters.factory_parameters') }}">پارامترهای کارخانه</a> &gt; <a href="{{ url_for('factory_parameters.factory_details',factory_name=factory_name) }}">کارخانه</a> &gt; {{ pool_label }}</nav>
<h2>{{ pool_label }}</h2><p>جمع مخزن: <strong id="total">{{ pool_total }}</strong> ریال</p>
<table class="table"><thead><tr><th>شناسه ثابت</th><th>موضوع</th><th>هزینه</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table>
<button class="btn btn-add" id="add">افزودن قلم سطح سوم</button><button class="btn btn-save" id="save">ذخیره تغییرات</button>
</div><script>
const source={{ table_json|tojson }}, urls={{ item_urls|tojson }};
let rows=source.data.id.map((id,i)=>({id,subject:source.data.subject[i],cost:source.data.cost[i]}));
function render(){document.getElementById('rows').innerHTML=rows.map((r,i)=>`<tr><td>${r.id}</td><td contenteditable="true" oninput="rows[${i}].subject=this.innerText">${r.subject}</td><td contenteditable="true" oninput="rows[${i}].cost=this.innerText">${r.cost}</td><td><a class="btn" href="${urls[r.id]||'#'}">مشاهده</a> <button onclick="rows.splice(${i},1);render()">حذف</button></td></tr>`).join('');}
document.getElementById('add').onclick=()=>{const subject=prompt('موضوع قلم');if(!subject)return;let base=subject.replace(/[^A-Za-z0-9_.-]/g,'')||`Item${rows.length+1}`,id=base,n=2;while(rows.some(r=>r.id===id))id=`${base}-${n++}`;rows.push({id,subject,cost:0});render();};
document.getElementById('save').onclick=async()=>{const payload={_order:['id','subject','cost'],data:{id:rows.map(r=>r.id),subject:rows.map(r=>r.subject),cost:rows.map(r=>Number(r.cost))}};const response=await fetch({{ save_url|tojson }},{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const out=await response.json();if(response.ok){document.getElementById('total').innerText=out.pool_total;location.reload()}else alert(out.message);};render();
</script>{% endblock %}
